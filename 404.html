<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Page not found | NovAtom Labs</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0d11; color: #e9ebee; font: 1rem/1.55 system-ui, sans-serif; }
    .missing { min-height: 100svh; display: grid; align-content: center; justify-items: start; gap: 1.25rem; padding: clamp(1.5rem, 6vw, 6rem); }
    .missing-mark { position: relative; width: clamp(9rem, 20vw, 18rem); }
    .missing-mark img { display: block; width: 100%; height: auto; }
    .missing-mark canvas { display: none; position: absolute; inset: -50% 0 auto; width: 100%; height: 200%; pointer-events: none; }
    .missing-mark.is-particle img { visibility: hidden; }
    .missing-mark.is-particle canvas { display: block; }
    .missing .code { margin-top: 2rem; color: #aac4ff; font-family: ui-monospace, monospace; }
    .missing h1 { margin: 0; font-size: clamp(3rem, 10vw, 8rem); line-height: .95; letter-spacing: -.06em; }
    .missing p { margin: 0; max-width: 42ch; }
    .missing nav { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; }
    .missing nav a { color: inherit; text-underline-offset: .2em; }
    .missing nav .btn { padding: .65rem 1rem; border: 1px solid #595953; background: #1b1b19; text-decoration: none; }
    .missing a:focus-visible { outline: 2px solid #aac4ff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main class="missing">
    <a class="missing-mark" href="/" aria-label="NovAtom Labs home">
      <img src="/novatom-titanium.svg" alt="" width="958" height="187" />
      <canvas aria-hidden="true"></canvas>
    </a>
    <p class="code">404</p>
    <h1>Page not found.</h1>
    <p>The page may have moved, or the link may be out of date.</p>
    <nav aria-label="Recovery links">
      <a class="btn" href="/">Back to home</a>
      <a class="textlink" href="/products">Explore products</a>
    </nav>
  </main>
  <script type="module">
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      import('/src/scene/particle-signature.js').then(({ mountParticleSignature }) => {
        mountParticleSignature(document.querySelector('.missing-mark'));
      }).catch(() => {});
    }
  </script>
</body>
</html>
