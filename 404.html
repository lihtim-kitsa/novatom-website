<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>404 · Page not found | NovAtom Labs</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0d11; color: #e9ebee; font: 1rem/1.55 system-ui, sans-serif; }
    .missing-brand { position: absolute; inset: clamp(1rem, 3vw, 3rem) auto auto clamp(1rem, 3vw, 3rem); }
    .missing-brand img { display: block; width: clamp(7rem, 12vw, 11rem); height: auto; }
    .missing { min-height: 100svh; display: grid; align-content: center; justify-items: center; gap: 1rem; padding: 5rem 1rem 2rem; text-align: center; }
    .missing-code { display: flex; align-items: center; justify-content: center; font: 700 clamp(4.5rem, 25vw, 21rem)/.9 system-ui, sans-serif; letter-spacing: -.07em; }
    .missing-zero { position: relative; display: grid; place-items: center; width: clamp(6.5rem, 36vw, 28rem); aspect-ratio: 1; }
    .missing-zero canvas { position: absolute; inset: 0; width: 100%; height: 100%; visibility: hidden; }
    .missing-zero.has-atom canvas { visibility: visible; }
    .missing-zero.has-atom span { visibility: hidden; }
    .missing h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 3.5rem); line-height: 1; letter-spacing: -.055em; }
    .missing p { margin: 0; max-width: 42ch; }
    .missing nav { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 1rem; }
    .missing nav a { color: inherit; text-underline-offset: .2em; }
    .missing nav .btn { padding: .65rem 1rem; border: 1px solid #595953; background: #1b1b19; text-decoration: none; }
    a:focus-visible { outline: 2px solid #aac4ff; outline-offset: 4px; }
  </style>
</head>
<body>
  <a class="missing-brand" href="/" aria-label="NovAtom Labs home">
    <img src="/novatom-titanium.svg" alt="" width="958" height="187" />
  </a>
  <main class="missing">
    <div class="missing-code" aria-hidden="true">
      <span>4</span><span class="missing-zero"><span>0</span><canvas></canvas></span><span>4</span>
    </div>
    <h1>Page not found.</h1>
    <p>The page may have moved, or the link may be out of date.</p>
    <nav aria-label="Recovery links">
      <a class="btn" href="/">Back to home</a>
      <a class="textlink" href="/products">Explore products</a>
    </nav>
  </main>
  <script type="module">
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      import('/src/scene/field.js').then(async ({ Field }) => {
        const slot = document.querySelector('.missing-zero');
        const canvas = slot.querySelector('canvas');
        const field = await new Field(canvas, { count: 6500, latCount: 0, dprMax: 1.25, fps: 30, wordmark: false }).init();
        Object.assign(field.state, { intro: 1, scale: 1.48, ripple: .4 });
        const fallback = () => slot.classList.remove('has-atom');
        field.onDegrade = level => { if (level === 'off') fallback(); };
        canvas.addEventListener('webglcontextlost', () => { field.lost = true; fallback(); }, { once: true });
        canvas.addEventListener('pointermove', e => { if (e.pointerType !== 'touch') field.pointer(e.clientX, e.clientY); });
        canvas.addEventListener('pointerleave', () => field.pointer(null));
        new ResizeObserver(() => { if (!field.lost && !field.disabled) field.resize(); }).observe(slot);
        field.renderOnce();
        slot.classList.add('has-atom');
        let previous;
        function draw(time) {
          if (field.lost || field.disabled) return;
          const dt = Math.min((time - (previous ?? time)) / 1000, .1);
          previous = time;
          field.update(time / 1000, dt);
          requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);
      }).catch(() => {});
    }
  </script>
</body>
</html>
