<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>404 · Page not found | NovAtom Labs</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0d11 repeating-linear-gradient(0deg, transparent 0 35px, #1b2330 35px 36px); color: #e9ebee; font: 1rem/1.55 system-ui, sans-serif; }
    .missing-brand { position: absolute; inset: clamp(1rem, 3vw, 3rem) auto auto clamp(1rem, 3vw, 3rem); }
    .missing-brand img { display: block; width: clamp(7rem, 12vw, 11rem); height: auto; }
    .missing { min-height: 100svh; display: grid; align-content: center; justify-items: center; gap: 1rem; padding: 5rem 1rem 2rem; text-align: center; }
    .missing-brand { z-index: 2; }
    .missing { z-index: 1; }
    .missing { position: relative; pointer-events: none; }
    .missing nav { pointer-events: auto; }
    #missing-scene { position: fixed; inset: 0; width: 100%; height: 100%; visibility: hidden; pointer-events: none; }
    .missing-code { display: grid; place-items: center; width: min(100%, 64rem); min-height: clamp(9rem, 31vw, 23rem); font: 800 clamp(6rem, 24vw, 19rem)/.95 system-ui, sans-serif; letter-spacing: -.075em; }
    .has-missing-scene #missing-scene { visibility: visible; }
    .has-missing-scene .missing-code { visibility: hidden; }
    .missing h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 3.5rem); line-height: 1; letter-spacing: -.055em; }
    .missing p { margin: 0; max-width: 42ch; }
    .missing nav { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 1rem; }
    .missing nav a { color: inherit; text-underline-offset: .2em; }
    .missing nav .btn { padding: .65rem 1rem; border: 1px solid #595953; background: #1b1b19; text-decoration: none; }
    a:focus-visible { outline: 2px solid #aac4ff; outline-offset: 4px; }
  </style>
</head>
<body>
  <canvas id="missing-scene" aria-hidden="true"></canvas>
  <a class="missing-brand" href="/" aria-label="NovAtom Labs home">
    <img src="/novatom-titanium.svg" alt="" width="958" height="187" />
  </a>
  <main class="missing">
    <div class="missing-code" aria-hidden="true">404</div>
    <h1>Page not found.</h1>
    <p>The page may have moved, or the link may be out of date.</p>
    <nav aria-label="Recovery links">
      <a class="btn" href="/">Back to home</a>
      <a class="textlink" href="/products">Explore products</a>
    </nav>
  </main>
  <script type="module">
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      import('/src/scene/not-found.js').then(({ mountNotFoundScene }) =>
        mountNotFoundScene(document.querySelector('#missing-scene'), document.querySelector('.missing-code'))
      ).catch(() => {});
    }
  </script>
</body>
</html>
