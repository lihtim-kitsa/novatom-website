    <section class="contact" id="contact" data-rail="Contact" data-pose="st:11;op:1;rp:.35;du:.35" aria-labelledby="h-contact">
      <div class="contact-inner">
        <div class="contact-copy">
          <h1 id="h-contact" class="h2 h1" data-split>Request access.</h1>
          <p>Tell us the problem you want to solve and the instruments or models you already use. We will reply with what a pilot would involve.</p>
        </div>
        <figure class="contact-crystal">
          <canvas class="crystal-scene" data-crystal-scene data-crystal-cycle width="600" height="600" role="img" aria-label="GaN four-atom crystal close-up" hidden></canvas>
          <figcaption>GaN · Wurtzite</figcaption>
        </figure>
        <form class="form" id="form" novalidate>
          <div class="field"><label for="f-name">Name</label><input id="f-name" name="name" type="text" autocomplete="name" required /><p class="err" id="e-name" hidden>Enter your name.</p></div>
          <div class="field"><label for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="email" required /><p class="err" id="e-email" hidden>Enter an email address we can reply to.</p></div>
          <div class="field"><label for="f-org">Organisation <span class="opt">optional</span></label><input id="f-org" name="organisation" type="text" autocomplete="organization" /></div>
          <div class="field"><label for="f-msg">What problem do you want to solve?</label><textarea id="f-msg" name="message" rows="4" required></textarea><p class="err" id="e-msg" hidden>Add a sentence or two about the problem.</p></div>
          <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" />
          <div class="form-foot">
            <button class="btn" type="submit" id="send">Send request</button>
            <p class="status-msg" id="formStatus" role="status" aria-live="polite"></p>
          </div>
        </form>
      </div>
    </section>
