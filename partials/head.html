  <script>
    /* opened straight from disk? the browser blocks the styles and scripts, so say what to do instead of showing a raw page */
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', function () {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#04060b;color:#e9ebee;display:grid;place-items:center;padding:2rem;text-align:center;font:18px/1.6 system-ui,Segoe UI,sans-serif';
        d.innerHTML = '<div style="max-width:34rem"><h1 style="font:700 30px/1.2 system-ui,sans-serif;margin:0 0 1rem">This site has to be opened through its local server</h1><p style="margin:0 0 1rem">Opening the HTML file directly blocks the styles and animation.</p><p style="margin:0">Double-click <b>START-WEBSITE.bat</b> in the project folder. It builds the site and opens <b>http://127.0.0.1:4173</b> for you.</p></div>';
        document.body.appendChild(d);
      });
    }
  </script>
  <script>
    /* Motion styles can distinguish enhanced pages from documents without JavaScript. */
    document.documentElement.classList.add('js');
  </script>
  <script>
    /* everyone gets the full experience; ?motion=reduce exists only so the static layout can be tested */
    var query = new URLSearchParams(location.search);
    if (query.get('motion') === 'reduce') document.documentElement.classList.add('reduced');
    if ((location.pathname === '/' || location.pathname === '/index.html') && !location.hash &&
        query.get('motion') !== 'reduce' && !query.has('safe') && query.get('tier') !== 'off' &&
        !matchMedia('(prefers-reduced-motion: reduce)').matches && location.protocol !== 'file:') {
      document.documentElement.classList.add('startup-loading');
      setTimeout(function () { document.documentElement.classList.remove('startup-loading'); }, 8000);
    }
  </script>
